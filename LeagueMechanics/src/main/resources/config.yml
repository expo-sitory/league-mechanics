# LEAGUE MECHANICS CONFIGURATION
# https://github.com/expo-sitory

general-settings:
  debug: true
  # true = always use the custom item models (pack loaded client-side / not pushed by the server)
  assume-client-pack: true
  debug-disabled-worlds:
    - world_nether
    - world_the_end
  disabled-commands-by-world:
    world_nether:
      - shop
      - runes
    world_the_end:
      - shop
      - runes

  mysql: # MySQL Configuration - Runes & KDA Multi Server Synchronization
    host: kupalhost
    port: 3306
    database: leaguemechanics
    username: root
    password: ""
    pool-size: 10
    idle-timeout: 300000
    max-lifetime: 1800000
    connection-timeout: 30000

buffs:
  crest_of_insight:
    display-name: "Crest of Insight"
    duration-seconds: 120
    ch: 10
    sr: 5
  crest_of_cinders:
    display-name: "Crest of Cinders"
    duration-seconds: 120
    slow-strength: 25
    slow-duration-ticks: 60
    inflame-duration-ticks: 60
  chemtech_blight:
    display-name: "Chemtech Blight"
    duration-seconds: 120
    tn: 24
    heal-multiplier: 1.7
  cloudbringers_grace:
    display-name: "Cloudbringer's Grace"
    duration-seconds: 120
    tn: 20
    ms: 20
  hextech_prowess:
    display-name: "Hextech Prowess"
    duration-seconds: 120
    ch: 20
    as: 40
  infernal_might:
    display-name: "Infernal Might"
    duration-seconds: 120
    ad-percent: 20
    ap-percent: 20
  mountainous_vigor:
    display-name: "Mountainous Vigor"
    duration-seconds: 120
    ar-percent: 20
    mr-percent: 20
  oceanic_will:
    display-name: "Oceanic Will"
    duration-seconds: 120
    hr: 5

