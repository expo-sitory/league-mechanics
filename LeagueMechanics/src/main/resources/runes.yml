runes:

  keystones:

    # ============================= #
    #        DOMINATION PATH        #
    # ============================= #

    domination:

      dark-harvest:
        adaptive-damage-per-stack: 7 # hardcoded max stack: 20
        cooldown: 60 # seconds - Cooldown before next soul reap

      electrocute:
        base-adaptive-damage: 34.5
        cooldown: 25 # seconds

      hail-of-blades:
        base-attack-speed: 40.0
        base-true-damage: 24.0
        cooldown: 45 # seconds


    # ============================= #
    #       PRECISION PATH          #
    # ============================= #

    precision:
      conqueror:
        base-adaptive-damage-per-stack: 0.8 # hard coded max stack: 12

      fleet-footwork:
        blocks-per-stack: 10.0
        projectile-stack-gain: 5
        heal-percent: 40.0
        ad-percentage-multiplier: 10.0
        ap-percentage-multiplier: 5.0

      lethal-tempo:
        base-adaptive-damage: 5.5 # adaptive damage when on max/active state
        attack-speed: 60.0 # when on max stacks/active state
        cooldown: 30 # seconds

      press-the-attack:
        base-adaptive-damage: 12.5
        cooldown: 6 # seconds

    # ============================= #
    #       INSPIRATION PATH        #
    # ============================= #

    inspiration:

      glacial-augment:
        base-freeze-duration: 120 # in ticks
        ad-percentage-multiplier: 7.0
        ap-percentage-multiplier: 6.0
        cooldown: 45 # seconds

      first-strike:
        initial-xp: 12.0 # starting xp
        ad-percentage-multiplier: 7.0
        ap-percentage-multiplier: 4.0
        buff-duration: 3 #seconds
        true-damage-amount: 14.0 # while on active state
        cooldown: 25 # seconds

    # ============================= #
    #       RESOLVE PATH            #
    # ============================= #

    resolve:

      aftershock:
        countdown-seconds: 2.5
        bonus-armor: 55.0
        bonus-magic-resist: 55.0
        base-shockwave-damage: 6.0
        shockwave-bonus-hp-percent: 5.0
        cooldown: 20 # seconds

      grasp-of-the-undying:
        heal-percent: 60.0
        cooldown: 45 # seconds

      guardian:
        range: 5.0
        bonus-armor-percent: 30.0
        bonus-magic-resist-percent: 30.0
        buff-duration-seconds: 10.0
        cooldown: 75


    # ============================= #
    #       SORCERY PATH            #
    # ============================= #

    sorcery:

      arcane-comet:
        base-adaptive-damage: 17.5
        ad-percentage-multiplier: 3.0
        ap-percentage-multiplier: 4.0
        cooldown: 20 # seconds

      deathfire-torch:
        base-magic-damage: 0.7
        ad-percentage-multiplier: 2.0
        ap-percentage-multiplier: 4.0

      storm-raider-surge:
        damage-percent-threshold: 20.0
        cooldown: 25 # seconds